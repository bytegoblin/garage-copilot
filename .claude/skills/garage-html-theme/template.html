<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --bg: #f6f4ef; --surface: #ffffff; --text: #22201c; --muted: #6b665c; --accent: #b4540a;
  --border: #ddd6c8; --head: #efe9dc; --quote: #fbf3e2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17150f; --surface: #211e17; --text: #ece6d8; --muted: #a39b8a; --accent: #e08a3c;
    --border: #3a352a; --head: #2c2820; --quote: #2a2418;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
header h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 4px; }
header p { margin: 0; color: var(--muted); }
nav { margin: 20px 0 8px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
nav ol { margin: 0; padding-left: 20px; columns: 2; column-gap: 24px; }
nav a { color: var(--accent); text-decoration: none; }
section { margin-top: 20px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
h2 { font-size: 1.25rem; margin: 0 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--accent); }
h3 { font-size: 1.05rem; margin: 16px 0 6px; }
p { margin: 8px 0; }
ul, ol { padding-left: 22px; }
li { margin: 4px 0; }
ul.checklist { list-style: none; padding-left: 4px; }
a { color: var(--accent); overflow-wrap: anywhere; }
code { background: var(--head); padding: 1px 5px; border-radius: 4px; font-size: .92em; }
blockquote { margin: 10px 0; padding: 8px 14px; background: var(--quote); border-left: 4px solid var(--accent); border-radius: 4px; }
.table-wrap { overflow-x: auto; margin: 10px 0; }
table { border-collapse: collapse; width: 100%; font-size: .93rem; }
th, td { border: 1px solid var(--border); padding: 6px 9px; text-align: left; vertical-align: top; }
th { background: var(--head); }
footer { margin-top: 28px; color: var(--muted); font-size: .88rem; text-align: center; }
@media (max-width: 560px) { nav ol { columns: 1; } header h1 { font-size: 1.5rem; } }
@media print {
  body { background: #fff; color: #000; }
  section, nav { border-color: #bbb; box-shadow: none; break-inside: avoid-page; }
  a { color: #000; }
}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>{{TITLE}}</h1>
<p>{{SUBTITLE}}</p>
</header>
<nav aria-label="Содержание">
<ol>
{{TOC}}
</ol>
</nav>
<main>
{{CONTENT}}
</main>
<footer>{{FOOTER}}</footer>
</div>
</body>
</html>
